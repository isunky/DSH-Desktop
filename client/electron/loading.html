<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #1e3a5f 0, #111827 52%);
        -webkit-app-region: drag;
      }
      main {
        width: min(520px, calc(100vw - 48px));
        padding: 36px 40px 30px;
        border: 1px solid rgba(148, 163, 184, .18);
        border-radius: 18px;
        background: rgba(15, 23, 42, .88);
        box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
      }
      .eyebrow { margin: 0 0 10px; color: #93c5fd; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: -.02em; }
      #stage { margin: 26px 0 8px; font-size: 16px; font-weight: 600; }
      #detail { min-height: 42px; margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.65; }
      .track { height: 7px; margin: 22px 0 12px; overflow: hidden; border-radius: 999px; background: #334155; }
      #bar { width: 8%; height: 100%; border-radius: inherit; background: #60a5fa; transition: width .35s ease; }
      #bar.indeterminate { width: 32%; animation: slide 1.25s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
      .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 20px; }
      #elapsed { color: #94a3b8; font-size: 12px; }
      button {
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 8px 12px;
        color: #e2e8f0;
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        -webkit-app-region: no-drag;
      }
      button:hover { border-color: #93c5fd; background: rgba(96, 165, 250, .12); }
      button:disabled { cursor: default; opacity: .7; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local desktop client</p>
      <h1>DeepSeek Harness</h1>
      <div id="stage">正在准备客户端</div>
      <p id="detail">正在初始化启动流程…</p>
      <div class="track" aria-label="启动进度"><div id="bar" class="indeterminate"></div></div>
      <div class="footer">
        <span id="elapsed">已用时 0 秒</span>
        <button id="cancel" type="button">取消启动并退出</button>
      </div>
    </main>
    <script>
      const stage = document.querySelector('#stage')
      const detail = document.querySelector('#detail')
      const bar = document.querySelector('#bar')
      const elapsed = document.querySelector('#elapsed')
      const cancel = document.querySelector('#cancel')
      const startedAt = Date.now()

      setInterval(() => {
        elapsed.textContent = `已用时 ${Math.floor((Date.now() - startedAt) / 1000)} 秒`
      }, 1000)

      window.__dshSetStartupState = ({ stage: nextStage, detail: nextDetail, progress }) => {
        if (nextStage) stage.textContent = nextStage
        if (nextDetail) detail.textContent = nextDetail
        if (typeof progress === 'number') {
          bar.classList.remove('indeterminate')
          bar.style.width = `${Math.max(3, Math.min(100, progress))}%`
        } else {
          bar.classList.add('indeterminate')
        }
      }

      cancel.addEventListener('click', () => {
        cancel.disabled = true
        cancel.textContent = '正在退出…'
        stage.textContent = '正在退出'
        detail.textContent = '正在停止安装任务和本地 DSH 服务，请稍候…'
        window.dshClient?.cancelStartup()
      })
      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') cancel.click()
      })
    </script>
  </body>
</html>
