name: Version Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_increment:
        description: Automatic version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: version-build-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Bump version or reuse this run's tag
        id: release
        shell: bash
        env:
          BUMP_KIND: ${{ inputs.version_increment }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "Select a branch to bump its version"; exit 1; }
            git fetch --prune origin "$GITHUB_REF_NAME" --tags
            git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            marker="Release-Run: $GITHUB_RUN_ID"
            tag=""
            while IFS= read -r candidate; do
              if [[ "$(git for-each-ref --format='%(contents)' "refs/tags/$candidate")" == *"$marker"* ]]; then
                tag="$candidate"
                break
              fi
            done < <(git tag --list 'v*')
            if [[ -n "$tag" ]]; then
              git checkout --detach "$tag"
            else
              version="$(node scripts/release-version.mjs bump "$BUMP_KIND")"
              tag="v$version"
              node scripts/release-notes.mjs verify "$tag"
              git diff --check
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
              git commit -m "chore(release): $tag [skip ci]"
              git tag -a "$tag" -m "DSH Launcher $tag" -m "$marker"
              git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          node scripts/release-notes.mjs verify "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf '### Release prepared\n\nVersion: %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.platform }} installer
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            command: client:package:win
            artifact: artifacts/win-x64/*.exe
          - platform: macos-arm64
            runner: macos-15
            command: client:package:mac:arm64
            artifact: artifacts/mac-arm64/*.dmg
          - platform: macos-x64
            runner: macos-15-intel
            command: client:package:mac:x64
            artifact: artifacts/mac-x64/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish version ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Generate recent changes
        run: node scripts/release-notes.mjs notes "$RELEASE_TAG" > release-notes.md
      - name: Upload assets and publish
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "DSH Launcher $RELEASE_TAG" --notes-file release-notes.md
          fi
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          [[ "${#assets[@]}" -eq 3 ]] || { echo "Expected three platform installers"; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
