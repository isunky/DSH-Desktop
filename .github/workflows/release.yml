name: Release Desktop Client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Check tag and client versions match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$tauri_version"

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: verify-version
    steps:
      - name: Checkout client and upstream
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm run client:package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            artifacts/win-x64/DeepSeek-Harness-*.exe
          if-no-files-found: error

  mac-arm64:
    name: macOS arm64
    runs-on: macos-15
    needs: verify-version
    steps:
      - name: Checkout client and upstream
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS arm64 packages
        run: pnpm run client:package:mac:arm64

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            artifacts/mac-arm64/*.dmg
          if-no-files-found: error

  mac-x64:
    name: macOS x64
    runs-on: macos-15-intel
    needs: verify-version
    steps:
      - name: Checkout client and upstream
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS x64 packages
        run: pnpm run client:package:mac:x64

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: |
            artifacts/mac-x64/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, windows, mac-arm64, mac-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "DeepSeek Harness ${GITHUB_REF_NAME}" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: find release-assets -type f -print0 | xargs -0 -n1 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
