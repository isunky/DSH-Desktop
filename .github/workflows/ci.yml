name: Basic CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Source checks and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Validate source and upstream pin
        shell: bash
        run: |
          node scripts/client.mjs check
          for file in scripts/*.mjs client/runtime/*.mjs client/runtime/*.cjs client/tauri/*.js; do
            node --check "$file"
          done
          node scripts/release-version.mjs next patch
          node scripts/release-notes.mjs verify "v$(node -p "require('./package.json').version")"
          node --test client/runtime/hide-console.test.cjs
          node --test client/tauri/core-theme.test.js
